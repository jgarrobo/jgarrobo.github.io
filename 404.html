<!doctype html>
<html lang="es">
<head>
  <script>try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Page not found</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .notfound { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px 16px; }
    .notfound img { width: 120px; height: 120px; margin: 0 auto 28px; display: block; }
    .notfound .code { margin: 0 0 8px; font-size: 14px; font-weight: 600; letter-spacing: 0.14em; color: var(--accent); }
    .notfound h1 { margin: 0 0 6px; font-size: clamp(26px, 5vw, 36px); line-height: 1.2; }
    .notfound .en { margin: 0 0 32px; color: var(--text-soft); }
    .notfound .actions { justify-content: center; }
  </style>
</head>
<body>
  <main class="notfound">
    <div>
      <img src="/assets/favicon.svg" alt="">
      <p class="code">404</p>
      <h1>Página no encontrada</h1>
      <p class="en" lang="en">Page not found</p>
      <div class="actions">
        <a class="btn primary" href="/">Volver al inicio</a>
        <a class="btn" href="/en/" lang="en">Back to home</a>
      </div>
    </div>
  </main>
</body>
</html>
